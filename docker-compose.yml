services:
  tmrl-db:
    image: postgres:16-alpine
    container_name: tmrl-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tmrl}
      POSTGRES_USER: ${POSTGRES_USER:-tmrl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tmrl} -d ${POSTGRES_DB:-tmrl}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tmrl-hub

  tmrl-api:
    build:
      context: ./tmrl-api
      dockerfile: Dockerfile
    image: tmrl-api:local
    container_name: tmrl-api
    restart: unless-stopped
    environment:
      TMRL_ENVIRONMENT: production
      TMRL_API_TOKEN: ${API_TOKEN:-change-me}
      TMRL_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8080}
      TMRL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tmrl}:${POSTGRES_PASSWORD:-change-me}@tmrl-db:5432/${POSTGRES_DB:-tmrl}
      TMRL_CHECKPOINT_DIR: /data/checkpoints
      TMRL_MEMORY_DIR: /data/memory
      TMRL_METRICS_DIR: /data/metrics
      TMRL_LOG_DIR: /data/logs
      TMRL_ALLOWED_CHECKPOINT_EXTENSIONS: .pt,.pth,.ckpt,.tcpt,.tmod,.zip,.bin,.pkl
      TMRL_CHOWN_DATA: "true"
    volumes:
      - ./data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      tmrl-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - tmrl-hub

  tmrl-dashboard:
    build:
      context: ./tmrl-dashboard
      dockerfile: Dockerfile
    image: tmrl-dashboard:local
    container_name: tmrl-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      tmrl-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tmrl-hub

networks:
  tmrl-hub:
    name: tmrl-hub

volumes:
  postgres_data:
